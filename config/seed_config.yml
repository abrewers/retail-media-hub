# ---------------------------------------------------------------------------
# Contracts. Rendered to PDF insertion orders (IOs). The make-good terms below appear
# ONLY in the PDF text: the setup job extracts them with ai_parse_document + ai_extract,
# then checks the extracted values against this file.
# folder: contracts -> extracted on setup; samples -> left for the live "drop a new IO" demo.
# ---------------------------------------------------------------------------
contracts:
  - campaign_id: 1
    folder: contracts
    io_number: IO-2026-0731
    advertiser_legal_name: FizzCo Beverages LLC
    advertiser_signatory: {name: Priya Raman, title: "Senior Manager, Shopper Marketing"}
    effective_offset: -109
    makegood_threshold_pct: 100
    makegood_window_days: 30
    credit_option_shortfall_pct: 15
    excess_remedy: "a pro-rata credit at the contracted CPM for all undelivered impressions"
    special_terms: "Delivery is measured across all participating sites in aggregate."
  - campaign_id: 7
    folder: contracts
    io_number: IO-2026-0802
    advertiser_legal_name: VoltRush Beverage Company
    advertiser_signatory: {name: Marcus Lindgren, title: "Head of Trade Marketing"}
    effective_offset: -72
    makegood_threshold_pct: 95
    makegood_window_days: 21
    credit_option_shortfall_pct: 20
    excess_remedy: "a credit equal to the undelivered impressions multiplied by the contracted CPM"
    special_terms: "No make-good is owed where the shortfall is 5% of contracted impressions or less."
  - campaign_id: 9
    folder: contracts
    io_number: IO-2026-0915
    advertiser_legal_name: Apex Energy Drinks Inc.
    advertiser_signatory: {name: Elena Vasquez, title: "Brand Partnerships Lead"}
    effective_offset: -44
    makegood_threshold_pct: 90
    makegood_window_days: 14
    credit_option_shortfall_pct: 25
    excess_remedy: "either a credit or a split remedy of 50% make-good impressions and 50% credit, at the Advertiser's election"
    special_terms: "Make-good impressions must run on highway and transit sites only."
  - campaign_id: 3
    folder: samples
    io_number: IO-2026-0904
    advertiser_legal_name: FizzCo Beverages LLC
    advertiser_signatory: {name: Priya Raman, title: "Senior Manager, Shopper Marketing"}
    effective_offset: -60
    makegood_threshold_pct: 95
    makegood_window_days: 21
    credit_option_shortfall_pct: 10
    excess_remedy: "a pro-rata credit at the contracted CPM, or bonus impressions on urban and highway sites, at the Advertiser's election"
    special_terms: "Flight start is contingent on creative approval; the flight end date does not move if approval is late."

# ---------------------------------------------------------------------------
# App write-back seed rows (Lakebase app_ops), created by the app on first start
# and restored by "Reset demo data". People are fictional.
# ---------------------------------------------------------------------------
app_seed:
  users:
    ops_analyst: jordan.ellis@example.com
    ops_manager: sam.okafor@example.com
    finance_approver: riley.chen@example.com
  make_goods:
    - {campaign_id: 42, type: extension, status: submitted, created_by: ops_analyst, created_offset: -3,
       clause: "Section 7.2: make-good owed if delivery falls below 90%",
       notes: "Flight closed at 79.9% delivery. Proposing a 5-day extension on the same sites."}
    - {campaign_id: 45, type: credit, status: approved, created_by: ops_manager, created_offset: -6,
       approved_by: finance_approver, approved_offset: -5,
       clause: "Section 7.1: pro-rata credit",
       notes: "Flight closed at 53.8% delivery. Credit memo issued to Morning Ring Donuts."}
  rebalances:
    # site targets are chosen by the app at seed time from the campaign's real site data
    - {campaign_id: 1, created_by: ops_analyst, created_offset: -1, increase_top_sites: 2, decrease_bottom_sites: 1,
       statuses: [approved, pending, pending], reason: "Shift delivery from a low-traffic suburban site to high-traffic sites"}
    - {campaign_id: 7, created_by: ops_manager, created_offset: -2, increase_top_sites: 1, decrease_bottom_sites: 0,
       statuses: [executed], reason: "Recover pace at a high-traffic site before flight end"}
