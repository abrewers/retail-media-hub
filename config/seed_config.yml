# Retail Media Command Center: synthetic demo data configuration.
#
# The setup job (src/notebooks/setup.py) turns this file into source tables and
# contract PDFs. Everything is deterministic (fixed random seed): the same config
# always produces the same data.
#
# Dates are OFFSETS in days from as_of_date (set by the bundle variable as_of_date;
# default: the day setup runs), so the demo always looks current.
# Advertisers, people and contracts are fictional.

random_seed: 42
data_start_offset: -102          # first day of impression history (relative to as_of_date)

# Retailer branding. `name` is the default; the setup job's `retailer_name` parameter (asked by
# scripts/configure.sh) overrides it. "{retailer}" anywhere in this file is replaced with the name.
retailer:
  name: "Waypoint Fuel & Market"
  network_name: "{retailer} Retail Media"
  publisher_legal_name: "{retailer}, Inc."
  publisher_signatory: {name: Dana Whitfield, title: "Director, Retail Media Partnerships"}

# ---------------------------------------------------------------------------
# Sites. Impressions are generated from traffic, not assigned directly:
#   impressions(campaign, site, day) = fuel_transactions(site, day)
#                                      x screens_online / screens_installed
#                                      x campaign share x noise
# and then scaled per campaign so its total matches `delivered` below.
# Suburban sites get 10-30x fewer fuel transactions than urban/highway sites.
# ---------------------------------------------------------------------------
sites:
  per_region: 42
  archetype_mix: {urban: 0.30, highway: 0.25, suburban: 0.45}
  daily_fuel_transactions:       # [min, max] baseline per site per day
    urban: [1800, 3000]
    highway: [1500, 2600]
    suburban: [80, 250]
  weekend_factor: {urban: 0.85, highway: 1.25, suburban: 1.05}
  pumps: {urban: [8, 12], highway: [12, 20], suburban: [4, 8]}
  screens_per_pump: 1
  baseline_uptime: [0.96, 1.0]    # normal share of screens online
  regions:
    Southwest:
      state_cities: [[AZ, Phoenix], [AZ, Tucson], [AZ, Mesa], [NM, Albuquerque], [NV, Las Vegas], [TX, El Paso]]
    Southeast:
      state_cities: [[FL, Tampa], [FL, Orlando], [GA, Atlanta], [NC, Charlotte], [SC, Columbia], [FL, Jacksonville]]
    Midwest:
      state_cities: [[IL, Chicago], [OH, Columbus], [IN, Indianapolis], [MI, Detroit], [WI, Milwaukee], [MO, St. Louis]]
    Northeast:
      state_cities: [[PA, Pittsburgh], [NY, Albany], [MA, Worcester], [CT, Hartford], [NJ, Trenton], [PA, Allentown]]

# ---------------------------------------------------------------------------
# "Why" stories, built into the drivers (never written as a reason column).
# ---------------------------------------------------------------------------
stories:
  # 1. Why is FizzCo Summer Fuel-Up so far behind pace?
  #    A firmware rollout leaves screens mostly offline at Southwest sites for 3 weeks.
  #    Every campaign running at those sites dips in the same window.
  screen_outage:
    region: Southwest
    start_offset: -45
    days: 21
    sites: 15                     # chosen from the highest-traffic sites serving campaign 1
    anchor_campaign_id: 1
    uptime: [0.25, 0.40]          # share of screens online during the outage
  # 2. Why is FizzCo Holiday Refresh critical with 10 days left?
  #    Creative approval came 5 days after flight start (no impressions until then),
  #    and its site plan leans on low-traffic suburban sites.
  late_creative:
    campaign_id: 3
    delay_days: 5
  site_plan_overrides:
    # archetype weights used when picking each campaign's sites (default: sites.archetype_mix)
    1: {urban: 0.45, highway: 0.35, suburban: 0.20}
    3: {urban: 0.15, highway: 0.10, suburban: 0.75}
  # 3. Why do suburban sites underperform? Falls out of daily_fuel_transactions above:
  #    impressions per fuel transaction are flat across archetypes; traffic is the gap.

paused_after_days: 10            # paused campaigns stopped delivering this many days after start

# ---------------------------------------------------------------------------
# Campaigns (47). `delivered` is the total impressions delivered as of as_of_date;
