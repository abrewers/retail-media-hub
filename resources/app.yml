resources:
  apps:
    app:
      name: ${var.app_name}
      description: "Retail Media Hub: campaign pacing, rebalancing, make-goods, IO contract upload and Genie"
      source_code_path: ../src/app
      # Genie questions run with the signed-in user's permissions (on-behalf-of-user).
      user_api_scopes:
        - genie
      config:
        command: ["pnpm", "run", "start"]
        env:
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: RMH_CATALOG
            value: ${var.catalog}
          - name: RMH_SCHEMA
            value: ${var.schema}
          - name: RMH_ALLOW_RESET
            value: "true"
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.ops_db.name}/branches/production
            database: ${resources.postgres_projects.ops_db.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
